<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="middle">
  <aside id="sidebar">
    <div id="brand"><span class="mark">⌘</span><span>Coding Agent</span></div>
    <div class="tree-label">
      <span>工作区</span>
      <button id="btn-add-workspace" class="icon-mini" title="添加工作区">＋</button>
    </div>
    <div class="sidebar-scroll" id="tree-wrap"><div id="tree"></div></div>
    <div class="sidebar-foot">
      <button id="btn-settings" class="side-btn">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 3.5-2.1.6a6 6 0 0 1-1 2.4l1.2 1.8-1.4 1.4-1.8-1.2a6 6 0 0 1-2.4 1L9.4 20h-2l-.6-2.1a6 6 0 0 1-2.4-1l-1.8 1.2-1.4-1.4 1.2-1.8a6 6 0 0 1-1-2.4L.3 12l2.1-.6a6 6 0 0 1 1-2.4L2.2 7.2l1.4-1.4 1.8 1.2a6 6 0 0 1 2.4-1L8.4 3.5h2l.6 2.1a6 6 0 0 1 2.4 1l1.8-1.2 1.4 1.4-1.2 1.8a6 6 0 0 1 1 2.4l2.1.6z"/></svg>
        设置
      </button>
    </div>
  </aside>

  <main id="chat">
    <div id="chat-header">
      <span id="chat-session-name">—</span>
    </div>
    <div id="chat-scroll">
      <div id="empty">
        <div class="logo">⌘</div>
        <h1>Coding Agent</h1>
        <p>选择一个会话，或输入任务开始</p>
      </div>
      <div class="chat-col" id="chat-col"></div>
    </div>
    <footer id="input-bar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="btn-run" class="send">
          <span class="ic-send"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z" fill="currentColor"/></svg></span>
          <span class="ic-stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></span>
          <span class="btn-label">发送</span>
        </button>
      </div>
    </footer>
  </main>

  <aside id="right-panel">
    <div class="right-head"><span>文件</span><button id="btn-file-up" class="icon-mini">↩</button></div>
    <div class="panel-body"><div id="files"></div></div>
  </aside>
</div>

<!-- 设置弹窗（居中，左侧菜单栏，固定大小，点击外部关闭） -->
<div id="settings" class="modal hidden">
  <div class="settings-box">
    <div class="settings-menu">
      <div class="settings-title">设置</div>
      <button class="st active" data-tab="appearance">外观</button>
      <button class="st" data-tab="tools">工具</button>
      <button class="st" data-tab="about">关于</button>
    </div>
    <div class="settings-content">
      <div id="tab-appearance" class="stab active">
        <h4>主题</h4>
        <div class="radio-group">
          <label class="radio-card"><input type="radio" name="theme" value="dark" checked><span>深色</span></label>
          <label class="radio-card"><input type="radio" name="theme" value="light"><span>浅色</span></label>
        </div>
      </div>
      <div id="tab-tools" class="stab"><h4>工具</h4><div id="tools" class="tools-grid"></div></div>
      <div id="tab-about" class="stab"><h4>关于</h4><p class="about-text">Coding Agent · 自研编程智能体<br>事件驱动架构 · 零框架依赖</p></div>
    </div>
  </div>
</div>

<!-- 文件夹选择器 -->
<div id="workspace-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3>选择工作区文件夹</h3><button id="btn-workspace-cancel" class="icon-close">✕</button></div>
    <div id="browse-path" class="browse-path"></div>
    <div id="browse-hint" class="browse-hint">请进入要作为工作区的文件夹</div>
    <div id="browse-list" class="browse-list"></div>
    <div class="modal-actions">
      <button id="btn-browse-up" class="ghost">↩ 上级</button>
      <button id="btn-workspace-choose" disabled>选择此文件夹</button>
    </div>
  </div>
</div>

<!-- 审批弹窗 -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="confirm-title"></h3></div>
    <pre id="confirm-desc"></pre>
    <div class="modal-actions">
      <button id="btn-approve">批准</button>
      <button id="btn-reject" class="danger">拒绝</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
