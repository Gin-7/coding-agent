<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div id="brand"><span class="mark">⌘</span><span>Coding Agent</span></div>
  <div class="top-group">
    <button id="btn-workspace" class="pill" title="选择工作区文件夹">
      <span class="pill-label">工作区</span><span id="ws-name">选择文件夹</span>
    </button>
    <div class="session-box">
      <select id="session-select" title="切换会话"></select>
      <button id="btn-session-new" class="icon" title="新建会话">＋</button>
    </div>
  </div>
  <div class="top-right">
    <button id="btn-theme" class="icon" title="切换明暗主题">🌙</button>
    <button id="btn-settings" class="icon" title="设置">⚙</button>
    <span id="status-dot"></span>
    <span id="status-text">空闲</span>
    <button id="btn-interrupt" disabled>中断</button>
  </div>
</header>

<div id="main">
  <div id="content">
    <div id="chat">
      <div id="empty">
        <div class="logo">⌘</div>
        <h1>Coding Agent</h1>
        <p>选择合适的文件夹作为工作区，输入任务开始</p>
      </div>
      <div class="chat-col" id="chat-col"></div>
    </div>
    <footer id="input-bar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="btn-run">运行</button>
      </div>
    </footer>
  </div>
  <aside id="right-panel">
    <div class="right-head">
      <span>文件</span>
      <button id="btn-file-up" class="icon" title="上级目录">↩</button>
    </div>
    <div class="panel-body"><div id="files"></div></div>
  </aside>
</div>

<!-- 设置抽屉 -->
<div id="settings" class="drawer hidden">
  <div class="drawer-menu">
    <button class="menu-item active" data-tab="appearance">外观</button>
    <button class="menu-item" data-tab="tools">工具</button>
    <button class="menu-item" data-tab="about">关于</button>
    <button id="btn-settings-close" class="menu-item close">✕</button>
  </div>
  <div class="drawer-content">
    <section id="tab-appearance" class="tab active">
      <h3>主题</h3>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="dark" checked>深色</label>
        <label><input type="radio" name="theme" value="light">浅色</label>
      </div>
    </section>
    <section id="tab-tools" class="tab">
      <h3>工具列表</h3>
      <div id="tools"></div>
    </section>
    <section id="tab-about" class="tab">
      <h3>关于</h3>
      <p class="about-text">Coding Agent — 自研编程智能体。<br>事件驱动架构 · 零框架依赖。</p>
    </section>
  </div>
</div>

<!-- 文件夹选择器 -->
<div id="workspace-modal" class="modal hidden">
  <div class="modal-box">
    <h3>选择工作区文件夹</h3>
    <div id="browse-path" class="browse-path"></div>
    <div id="browse-list" class="browse-list"></div>
    <div class="modal-actions">
      <button id="btn-browse-up" class="ghost">↩ 上级</button>
      <button id="btn-workspace-cancel" class="danger">取消</button>
      <button id="btn-workspace-choose">选择此文件夹</button>
    </div>
  </div>
</div>

<!-- 审批弹窗 -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="confirm-title"></h3>
    <pre id="confirm-desc"></pre>
    <div class="modal-actions">
      <button id="btn-approve">批准</button>
      <button id="btn-reject" class="danger">拒绝</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
